<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111914">
  <title>尖塔戰術工作台｜STS2 Solver</title>
  <style>
    :root{color-scheme:light;--ink:#1a241e;--muted:#536357;--paper:#f3f3ec;--panel:#fffefa;--line:#d9ddd3;--deep:#111914;--deep2:#1b2820;--accent:#b84030;--accent-soft:#fbebe6;--green:#247052;--green-soft:#e8f2eb;--gold:#c69235;--gold-soft:#f6efd9;--blue:#386b75;--shadow:0 12px 32px rgba(24,37,28,.07);font-family:Inter,"Segoe UI","Noto Sans TC",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.48}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #72aaa0;outline-offset:2px}a{color:inherit}
    .topbar{height:62px;background:var(--deep);color:#f6f3e8;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1440px)/2));border-bottom:1px solid #2b3930}.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.02em}.version{color:#b7c2b6;font-size:12px;display:flex;align-items:center;gap:8px}
    .app{max-width:1440px;margin:0 auto;padding:26px 28px 54px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:15px 17px 12px;border-bottom:1px solid #e7e9e1;display:flex;align-items:center;justify-content:space-between;gap:10px}.panel-title{font-size:15px;font-weight:750;margin:0;letter-spacing:-.015em}.head-action{border:0;background:none;color:var(--green);font-size:12px;font-weight:700;padding:5px}.panel-body{padding:15px 17px}.rows{display:grid;gap:9px}.row-card{border:1px solid #e1e5dc;background:#fcfcf8;border-radius:8px;padding:11px 12px}.row-caption{font-size:11px;color:var(--muted)}.remove{width:26px;height:26px;border:1px solid #e4d8d4;background:#fff9f7;color:#9c5142;border-radius:5px;font-size:17px;line-height:1}.empty{padding:16px;border:1px dashed #d4dacf;border-radius:7px;color:#728077;font-size:12px;text-align:center}.recommendation{border:1px solid #d9e6db;background:#f0f6ef;border-radius:9px;padding:13px 14px;margin-bottom:13px}.recommendation .kicker{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--green);font-weight:800}.recommendation h2{font-size:17px;margin:4px 0 5px;line-height:1.35}.recommendation p{font-size:12px;color:#536259;margin:0}.target{font-size:10px;color:#52645a;border:1px solid #d9e0d8;border-radius:4px;padding:3px 6px}.reason{font-size:11px;color:#68766d;margin-top:10px;line-height:1.55}
    details{border-top:1px solid var(--line);background:#fafbf7}details summary{cursor:pointer;padding:14px 17px;font-weight:750;font-size:13px;list-style:none;display:flex;justify-content:space-between}details summary::-webkit-details-marker{display:none}details summary:after{content:"＋";color:#758278}details[open] summary:after{content:"−"}.footer{max-width:1440px;margin:0 auto;padding:0 28px 28px;color:#77837a;font-size:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.footer a{color:#406b59;text-underline-offset:2px}
    @media(max-width:1000px){.app{padding:22px 18px 44px}.topbar{padding:0 18px}}
    @media(max-width:620px){.app{padding:18px 12px 36px}.topbar{height:54px;padding:0 12px}.version{font-size:12px}.panel-head,.panel-body{padding-left:12px;padding-right:12px}.footer{padding:0 12px 22px}}
    [hidden]{display:none!important}
    ::selection{background:#d9e8da;color:#17281d}
    /* Live workspace: one column ordered by what the game asks for now (data-phase). */
    .live-workspace{display:flex;flex-direction:column;gap:14px;max-width:760px;margin:0 auto}
    .live-workspace .panel{border-radius:14px;box-shadow:none;min-width:0;transition:opacity .2s cubic-bezier(.16,1,.3,1)}
    .live-workspace .panel-head{padding:14px 18px;border-color:var(--line)}
    .live-workspace .panel-body{padding:0 18px 14px}
    .live-workspace .panel-body>p:first-child{margin:12px 0;color:#48594e;line-height:1.55;overflow-wrap:anywhere}
    .live-workspace .panel-title{display:flex;align-items:center;gap:9px;font-size:17px}
    .live-workspace .head-action{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 11px;border:1px solid var(--line);border-radius:7px;white-space:nowrap}
    .live-workspace .head-action:hover:not(:disabled){background:var(--green-soft)}
    .live-workspace .head-action:disabled{cursor:wait;opacity:.55}
    .icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
    .head-action .icon{width:16px;height:16px}
    .now-tag{display:none;margin-left:2px;padding:2px 8px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;font-weight:750;letter-spacing:.02em}
    /* The panel for the current game screen leads; the others shrink to their status line. */
    .live-workspace .panel.is-now{order:-1;border-color:#9fb8a7}
    .live-workspace .panel.is-now .now-tag{display:inline-block}
    .live-workspace .panel.is-now .panel-head{background:var(--deep2);color:#f6f3e8}
    .live-workspace .panel.is-now .panel-title{color:#f6f3e8}
    .live-workspace .panel.is-now .head-action{color:#f6f3e8;border-color:#6c8475}
    .live-workspace .panel.is-now .head-action:hover:not(:disabled){background:#31473a}
    .live-workspace .panel.is-idle .panel-head{padding-block:10px}
    .live-workspace .panel.is-idle .panel-title{font-size:14px;color:var(--muted)}
    .live-workspace .panel.is-idle [id$=Results],.live-workspace .panel.is-idle .result-only{display:none}
    .live-workspace .panel.is-idle .panel-body>p:first-child{margin:8px 0;font-size:13px;color:var(--muted)}
    #livePanel{order:9}
    #livePanel summary{padding:13px 18px;font-size:13px}
    #livePanel .head-action{margin-top:10px}
    .live-workspace .rows{gap:0}
    .live-workspace .row-card{display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:10px;background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 0}
    .live-workspace .row-card>.icon{grid-row:span 9;margin-top:2px;color:#5f7064}
    .live-workspace .row-card>:not(.icon){grid-column:2}
    .live-workspace .row-card p{margin:5px 0 0}
    .live-workspace .row-caption{font-size:12px;font-variant-numeric:tabular-nums}
    /* The single best choice on a choice screen. */
    .live-workspace .row-card.pick{margin-bottom:8px;padding:14px 16px;border:0;border-radius:10px;background:var(--gold-soft);color:#3d2d0c}
    .live-workspace .row-card.pick>.icon{color:#8a6420;width:24px;height:24px}
    .live-workspace .row-card.pick strong{font-size:18px}
    .live-workspace .row-card.pick .row-caption{color:#6b5016}
    .pick-label{display:block;margin-bottom:2px;font-size:12px;font-weight:750;color:#8a6420}
    /* Combat: this turn first, the next action largest. */
    .turn-now{padding:14px 16px;margin-bottom:10px;background:var(--green-soft);color:#163d2a;border-radius:10px}
    .turn-title{margin:0;font-size:13px;color:#3b5c4d}
    .turn-play{display:grid;gap:0;margin:6px 0 0;padding:0;list-style:none}
    .turn-play li{display:grid;grid-template-columns:22px minmax(0,1fr);column-gap:10px;align-items:start;padding:7px 0;overflow-wrap:anywhere}
    .turn-play li+li{border-top:1px solid #80978742}
    .turn-play li .icon{margin-top:2px;color:#2e6a4c}
    .turn-play li.next{padding:4px 0 10px}
    .turn-play li.next strong{font-size:21px;line-height:1.25}
    .turn-play li.next .icon{width:24px;height:24px}
    .turn-context{display:block;color:#3b5c4d;font-size:13px}
    .turn-potion{color:#2d5d68}
    .turn-end{display:flex;align-items:center;gap:10px;margin:8px 0 0;padding-top:8px;border-top:1px solid #80978742;font-size:14px;font-weight:700;color:#3b5c4d}
    .turn-end .icon{color:#2e6a4c}
    .later-turns{margin:4px 0 0;background:transparent}
    .later-turns summary{padding:12px 0;color:#385a48}
    .live-notes{margin:10px 0;color:#685323;font-size:12px}
    @media(max-width:480px){.live-workspace .panel-head{padding:12px 14px}.live-workspace .panel-body{padding:0 14px 12px}.turn-play li.next strong{font-size:19px}}
    @media(prefers-reduced-motion:reduce){.live-workspace .panel{transition:none}}
    /* ?overlay: the always-on-top advice window drops the page chrome and the backup model. */
    body.overlay .topbar, body.overlay #livePanel, body.overlay .footer { display: none; }
    body.overlay main, body.overlay .app { padding: 8px; gap: 8px; }
    body.overlay .live-workspace { gap: 8px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">尖塔戰術工作台</div>
    <span class="version">v0.113.1</span>
  </header>
  <main class="app">
    <!-- Icons: authored after Lucide (ISC), one 1.75 stroke on a 24 grid. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="i-combat" viewBox="0 0 24 24"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M14.5 6.5 18 3h3v3l-3.5 3.5M5 14l4 4M7 17l-3 3M3 19l2 2"/></symbol>
      <symbol id="i-card" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M12 8.5 14.5 12 12 15.5 9.5 12z"/></symbol>
      <symbol id="i-potion" viewBox="0 0 24 24"><path d="M10 2v7.5a2 2 0 0 1-.2.9L4.7 20.6a1 1 0 0 0 .9 1.4h12.8a1 1 0 0 0 .9-1.4l-5.1-10.2a2 2 0 0 1-.2-.9V2M8.5 2h7M7 16h10"/></symbol>
      <symbol id="i-end" viewBox="0 0 24 24"><path d="M5 22h14M5 2h14M17 22v-4.2a2 2 0 0 0-.6-1.4L12 12l-4.4 4.4a2 2 0 0 0-.6 1.4V22M7 2v4.2a2 2 0 0 0 .6 1.4L12 12l4.4-4.4A2 2 0 0 0 17 6.2V2"/></symbol>
      <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></symbol>
      <symbol id="i-shop" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/></symbol>
      <symbol id="i-rest" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4.1 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
      <symbol id="i-event" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="M14.1 5.6a2 2 0 0 0 1.8 0l3.7-1.9a1 1 0 0 1 1.4.9v12.8a1 1 0 0 1-.6.9l-4.5 2.3a2 2 0 0 1-1.8 0l-4.2-2.1a2 2 0 0 0-1.8 0l-3.7 1.9A1 1 0 0 1 3 19.4V6.6a1 1 0 0 1 .6-.9l4.5-2.3a2 2 0 0 1 1.8 0zM15 5.8v15M9 3.2v15"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.8 9.8 0 0 1 6.7 2.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.8 9.8 0 0 1-6.7-2.7L3 16M8 16H3v5"/></symbol>
    </svg>
    <div class="live-workspace" id="liveWorkspace">
    <section class="panel" id="solvePanel" aria-labelledby="solveTitle">
      <div class="panel-head">
        <h1 class="panel-title" id="solveTitle"><svg class="icon"><use href="#i-combat"/></svg>戰鬥<span class="now-tag">現在</span></h1>
        <button type="button" class="head-action" id="solveRefresh"><svg class="icon"><use href="#i-refresh"/></svg>重新搜尋</button>
      </div>
      <div class="panel-body">
        <p id="solveStatus" role="status">輪到你出牌時，這裡會列出本回合的出牌順序。</p>
        <div id="solveResults" class="rows"></div>
        <p class="row-caption result-only"><a href="docs/live-import.md">模型支援範圍</a></p>
      </div>
    </section>
    <section class="panel" id="rewardPanel" aria-labelledby="rewardTitle">
      <div class="panel-head">
        <h2 class="panel-title" id="rewardTitle"><svg class="icon"><use href="#i-gift"/></svg>選擇<span class="now-tag">現在</span></h2>
        <button type="button" class="head-action" id="rewardRefresh"><svg class="icon"><use href="#i-refresh"/></svg>重新讀取</button>
      </div>
      <div class="panel-body">
        <p id="rewardStatus" role="status">打開獎勵、商店、營火或事件時，這裡會排出最佳選項。</p>
        <div id="rewardResults" class="rows"></div>
      </div>
    </section>
    <section class="panel" id="mapPanel" aria-labelledby="mapTitle">
      <div class="panel-head">
        <h2 class="panel-title" id="mapTitle"><svg class="icon"><use href="#i-map"/></svg>地圖<span class="now-tag">現在</span></h2>
        <button type="button" class="head-action" id="mapRefresh"><svg class="icon"><use href="#i-refresh"/></svg>重新讀取</button>
      </div>
      <div class="panel-body">
        <p id="mapStatus" role="status">打開地圖時，這裡會建議下一站與整條路線。</p>
        <div id="mapResults" class="rows"></div>
      </div>
    </section>
    <details class="panel" id="livePanel">
      <summary>備用出牌模型</summary>
      <div class="panel-body">
        <p id="liveStatus" role="status">正在讀取遊戲…</p>
        <button type="button" class="head-action" id="liveToggle">暫停讀取</button>
        <div id="liveResults" aria-live="polite"></div>
      </div>
    </details>
    </div>
  </main>
  <footer class="footer"><a href="docs/policy.md">評分規則</a></footer>

  <script src="multi-turn.js"></script>
  <script src="live-policy.js"></script>
  <script src="map-policy.js"></script>
  <script src="reward-policy.js"></script>
  <script src="event-policy.js"></script>
  <script>
    const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    function renderLiveRoute(snapshot, result) {
      const plan=result.plans[0];
      if(!plan)throw new Error("目前找不到可比較的路線。");
      const turns=plan.turns.map((turn,i)=>{
        const actions=turn.actions.map(({card,potion,targetIds,energyCost})=>{
          if(potion==="StrengthPotion")return "<li>喝下力量藥水 <small>（+2 力量）</small></li>";
          const targets=targetIds.map(id=>result.enemies.find(e=>e.id===id)?.name||id);
          return `<li>${esc(card.name)}${targets.length?` → ${esc(targets.join("、"))}`:""} <small>（${energyCost??card.cost} 能量）</small></li>`;
        }).join("");
        const enemyHp=result.enemies.map(e=>`${e.name} ${turn.enemyHp[e.id]} HP`).join("、");
        return `<article class="row-card"><strong>第 ${snapshot.round+i} 回合${i===0?" · 現在":""}</strong>
          ${actions?`<ol>${actions}</ol>`:"<p>本回合不出牌。</p>"}
          <p class="row-caption">回合結束預測：玩家 ${turn.hp} HP，${esc(enemyHp)}，受傷 ${turn.damageTaken}。${turn.energyLeft>0&&turn.actions.at(-1)?.card?.endsSequence?" 餘燼會隨機消耗剩餘手牌，請等結算後重算。":""}</p></article>`;
      }).join("");
      const next=plan.turns[0]?.actions[0];
      const headline=next?.potion==="StrengthPotion"?"現在先喝力量藥水":
        next?.card?`現在先打出${next.card.name}`:"本回合建議不出牌";
      $("#liveResults").innerHTML=`<div class="recommendation"><div class="kicker">${result.truncated?"搜尋預算內的最高分路線":"支援模型中的最高分路線"}</div>
        <h2>${esc(headline)}</h2><p>${plan.won?"預測可擊敗敵人。":plan.dead?"目前搜尋到的路線預測會倒下。":"路線涵蓋目前可預測的回合。"} ${esc(result.stop)}</p>
        ${result.ignoredEffects?.length ? `<p>近似預測略過：${esc(result.ignoredEffects.join("、"))}</p>` : ""}
        ${result.estimatedShuffle?`<p>跨洗牌路線使用模擬牌序。${result.shuffleAgreement===3?"三個樣本的當回合建議一致。":"樣本的當回合建議有分歧。"}實際抽牌後會重新計算。</p>`:""}
        </div>
        <div class="rows" style="margin-top:12px">${turns}</div>`;
    }

    // The workbench reads the running game through the local reader; opened as a file it has nothing to show.
    const livePage=location.protocol!=="file:";
    if(!livePage)document.querySelector("main").innerHTML='<p class="empty">請執行 <code>dotnet run --project reader</code>，再開啟 http://127.0.0.1:8765/。</p>';
    let autoEnabled=livePage, liveBusy=false, previousState="", solvedState="";
    const icon=name=>`<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    // The panel for the screen the game shows now leads the page; the other two shrink to their status.
    function setPhase(phase){
      for(const [id,p] of [["solvePanel","combat"],["rewardPanel","choice"],["mapPanel","map"]]){
        $("#"+id).classList.toggle("is-now",p===phase);
        $("#"+id).classList.toggle("is-idle",p!==phase);
      }
    }
    async function refreshLive() {
      if(!autoEnabled||liveBusy||document.hidden)return;
      liveBusy=true;
      const status=$("#liveStatus");
      try {
        const response=await fetch("/capture",{headers:{"X-STS2-Capture":"1"}});
        const snapshot=await response.json();
        if(!autoEnabled)return;
        if(!response.ok)throw new Error(snapshot.error||"無法擷取戰鬥。");
        setPhase("combat");
        const {capturedAt,...state}=snapshot;
        const stateKey=JSON.stringify(state);
        if(stateKey!==solvedState){
          // The whole-fight search does not depend on the fallback planner supporting this state.
          solvedState=stateKey;
          // The route is deterministic until something random happens: when the change is exactly the
          // first planned step, drop it and keep the rest instead of searching again.
          if(lastPlan&&!solveBusy&&sameDecision(lastSnapshot,snapshot)){
            // Animations settling (block, HP, powers) after a play: same decision point, keep the route.
          } else if(lastPlan&&!solveBusy&&followsRoute(lastSnapshot,snapshot,lastPlan.route[0])){
            lastPlan.route.shift();
            renderPlan(lastPlan);
          } else runSolve();
          lastSnapshot=snapshot;
        }
        if(stateKey!==previousState){
          previousState=stateKey;
          // A state the fallback model cannot represent must not read as a failed capture (that clears the search route).
          try { renderLiveRoute(snapshot,globalThis.planLiveCombat(snapshot)); }
          catch(error) { $("#liveResults").replaceChildren(Object.assign(document.createElement("p"),{className:"empty",textContent:`備用模型：${error.message}`})); }
        }
        status.textContent=`第 ${snapshot.round} 回合 · ${new Date(capturedAt).toLocaleTimeString()} 已擷取 · 自動更新中`;
      } catch(error) {
        if(!autoEnabled)return;
        previousState="";
        $("#liveResults").replaceChildren();
        status.textContent=error.message;
        // Out of combat or between turns: drop the finished fight's route so it is not followed by mistake.
        if(solvedState&&!solveBusy){
          solvedState="";lastPlan=null;
          $("#solveResults").replaceChildren();
          $("#solveStatus").textContent="戰鬥結束或輪到敵人。輪到你出牌時會自動更新。";
        }
      } finally {
        liveBusy=false;
      }
    }
    $("#liveToggle").addEventListener("click",()=>{
      autoEnabled=!autoEnabled;
      $("#liveToggle").textContent=autoEnabled?"暫停讀取":"繼續讀取";
      if(autoEnabled)refreshLive();
      else $("#liveStatus").textContent="已暫停。下方建議來自最後一次擷取。";
    });
    async function refreshMap() {
      if($("#mapRefresh").disabled)return false;
      const button=$("#mapRefresh"),status=$("#mapStatus"),output=$("#mapResults");
      button.disabled=true;
      status.textContent="正在讀取地圖…";
      try {
        const response=await fetch("/map",{headers:{"X-STS2-Capture":"1"}});
        const map=await response.json();
        if(!response.ok)throw new Error(map.error||"地圖讀取失敗。");
        const result=globalThis.planMap(map);
        setPhase("map");
        const rooms=new Map(map.nodes.map(node=>[node.id,node]));
        output.innerHTML=result.paths.map(({nodes,score,counts},index)=>{
          const path=nodes.map(id=>rooms.get(id));
          const next=path[0];
          const labels=path.map(room=>`${room.name}（第 ${room.column+1} 欄）`);
          return `<article class="row-card${index===0?" pick":""}">${icon("map")}
            ${index===0?'<span class="pick-label">走這條</span>':""}<strong>下一站：${esc(next.name)}（第 ${next.column+1} 欄）</strong>
            <p>${labels.map(esc).join(" → ")}</p>
            <p class="row-caption">評分 ${score} · 營火 ${counts.rest} · 精英 ${counts.elite} · 商店 ${counts.shop}</p>
          </article>`;
        }).join("");
        const scope=`第 ${map.act} 章 · 進階 ${map.ascension} · ${map.hp}/${map.maxHp} HP · ${map.gold} 金幣`;
        status.textContent=result.paths.length
          ? `${scope} · 比較 ${result.evaluated} 條路線${result.truncated?"（部分路線未列入）":""}。評分以目前 HP 和金幣估算。`
          : `${scope} · 目前沒有後續可走的房間。`;
        return true;
      } catch(error) {
        output.replaceChildren();
        status.textContent="打開地圖時，這裡會建議下一站與整條路線。";
        return false;
      } finally {
        button.disabled=false;
      }
    }
    $("#mapRefresh").addEventListener("click",refreshMap);
    // Whole-fight search (rank-Yu solver). Runs on demand and whenever the live capture changes.
    let solveBusy=false, solvePending=false, gameNames=null, lastPlan=null, lastSnapshot=null;
    function sameDecision(prev,next){
      const pick=s=>JSON.stringify([s.round,s.players[0].energy,s.players[0].hand.map(c=>[c.name,c.upgrades]),s.players[0].potions]);
      return !!prev&&pick(prev)===pick(next);
    }
    // True when next differs from prev only by playing step (card left hand, or potion slot emptied).
    function followsRoute(prev,next,step){
      if(!prev||!step||prev.round!==next.round||step.kind==="end")return false;
      const key=c=>`${c.name.toLowerCase()}+${c.upgrades?1:0}`;
      const before=prev.players[0].hand.map(key), after=next.players[0].hand.map(key);
      const potions=p=>p.players[0].potions.filter(Boolean).length;
      if(step.kind==="potion")return before.join()===after.join()&&potions(next)===potions(prev)-1;
      const played=`${step.card.replace(/_/g,"").toLowerCase()}+${step.upgrade?1:0}`;
      const i=before.indexOf(played);
      if(i<0)return false;
      // Cards that return to hand (Trick Shot, Mourning Blow, Particle Wall) leave the hand as it was.
      if(before.join()===after.join()&&next.players[0].energy<prev.players[0].energy)return potions(next)===potions(prev);
      before.splice(i,1);
      return before.join()===after.join()&&potions(next)===potions(prev);
    }
    async function runSolve(){
      if(solveBusy){solvePending=true;return;}
      solveBusy=true;
      const button=$("#solveRefresh"),status=$("#solveStatus");
      button.disabled=true;
      status.textContent="正在計算本回合出牌…";
      try {
        const response=await fetch("/solve",{headers:{"X-STS2-Capture":"1"}});
        const plan=await response.json();
        if(!response.ok)throw new Error(plan.error||"搜尋失敗。");
        lastPlan=plan;
        await renderPlan(plan);
      } catch(error) {
        lastPlan=null;
        $("#solveResults").replaceChildren();
        status.textContent=error.message;
      } finally {
        button.disabled=false;
        solveBusy=false;
        if(solvePending){solvePending=false;runSolve();}
      }
    }
    async function renderPlan(plan){
      const status=$("#solveStatus"),output=$("#solveResults");
      // Chinese titles from the game's localization (/names); unknown ids fall back to a readable id.
      if(!gameNames){try{const r=await fetch("/names",{headers:{"X-STS2-Capture":"1"}});if(r.ok)gameNames=await r.json();}catch{}}
      const name=id=>{
        const suffix=id.endsWith("+")?"+":"";
        const [key,slot]=(suffix?id.slice(0,-1):id).split("#");
        const tables=gameNames?[gameNames.cards,gameNames.monsters,gameNames.potions,gameNames.powers,gameNames.relics]:[];
        const title=tables.map(t=>t?.[key]).find(Boolean)??key.toLowerCase().replace(/_/g," ");
        return title+suffix+(slot&&slot!=="1"?` #${slot}`:"");
      };
      {
        const turns=[];
        for(const step of plan.route){
          const turn=turns[step.turn-1]??={plays:[],end:false};
          if(step.kind==="play"||step.kind==="potion")turn.plays.push(step);
          if(step.kind==="end")turn.end=true;
        }
        const renderTurn=(turn,index)=>`<section class="${index===0?"turn-now":"row-card"}">
          <h2 class="turn-title">${index===0?"本回合":`${index+1} 回合`}</h2>
          ${turn.plays.length?`<ol class="turn-play">${turn.plays.map((step,i)=>{
            const potion=step.kind==="potion";
            const context=[potion&&step.potionSlot!=null?`第 ${step.potionSlot+1} 格`:"",
              step.target?`目標 ${name(step.target)}`:"",
              step.choices?.length?`選擇 ${step.choices.map(name).join("、")}`:""].filter(Boolean).join(" · ");
            return `<li${index===0&&i===0?' class="next"':""}>${icon(potion?"potion":"card")}<span><strong${potion?' class="turn-potion"':""}>${potion?"使用 ":""}${esc(name(potion?step.potion:step.card))}${step.upgrade?"+":""}</strong>${context?`<small class="turn-context">${esc(context)}</small>`:""}</span></li>`;
          }).join("")}</ol>`:""}
          ${turn.end?`<p class="turn-end">${icon("end")}${turn.plays.length?"然後結束回合":"直接結束回合"}</p>`:""}
        </section>`;
        const notes=[...new Set(plan.notes)];
        output.innerHTML=(turns.length?renderTurn(turns[0],0):"")
          +(notes.length?`<p class="live-notes">${notes.map(esc).join("。")}</p>`:"")
          +(turns.length>1?`<details class="later-turns"><summary>後續 ${turns.length-1} 回合預測</summary>${turns.slice(1).map((turn,i)=>renderTurn(turn,i+1)).join("")}</details>`:"");
        status.textContent=plan.victory?`照這個順序出牌，預測獲勝並剩 ${plan.finalHp}/${plan.maxHp} HP。`:"找不到必勝路線；以下是損失最少的出牌。";
      }
    }
    $("#solveRefresh").addEventListener("click",runSolve);
    let eventTable=null;
    const setRewardIcon=name=>$("#rewardTitle use").setAttribute("href",`#i-${name}`);
    // Event rooms: rank options with event-policy.js against the transcribed effects table.
    async function renderEvent(status,output){
      const response=await fetch("/event",{headers:{"X-STS2-Capture":"1"}});
      if(!response.ok)return false;
      const event=await response.json();
      if(!eventTable){const r=await fetch("/events.json");if(r.ok)eventTable=await r.json();}
      if(!gameNames){try{const r=await fetch("/names",{headers:{"X-STS2-Capture":"1"}});if(r.ok)gameNames=await r.json();}catch{}}
      const name=id=>gameNames?.cards?.[id]||gameNames?.relics?.[id]||gameNames?.potions?.[id]||id;
      const plan=globalThis.planEvent({...event,name},eventTable);
      setRewardIcon("event");
      status.textContent=`事件「${event.title??event.eventId}」· ${event.hp}/${event.maxHp} HP · ${event.gold} 金幣。${plan.known?"分數＝效果換算成的生命值。":"這個事件還沒有效果資料，只列出選項。"}`;
      const ranked=[...plan.ranked].sort((a,b)=>(b.score??0)-(a.score??0));
      output.innerHTML=ranked.map(o=>`<article class="row-card${o.originalIndex===plan.best?" pick":""}">${icon("event")}
        ${o.originalIndex===plan.best?'<span class="pick-label">選這個</span>':""}<strong>${esc(o.title??name(o.textKey.split(".").pop()))}</strong>
        <p class="row-caption">${o.locked?"無法選擇":o.lethal?"可能致死":Number.isFinite(o.score)&&(o.evaluated||o.score!==0)?`評分 ${o.score.toFixed(1)}${o.evaluated?"":"（部分未計）"}`:"未評估"}</p>
        ${o.description?`<p>${esc(o.description)}</p>`:""}
        ${o.reasons.map(r=>`<p>${esc(r)}</p>`).join("")}</article>`).join("");
      return true;
    }
    // Returns true when the game shows a reward, shop, rest site or event and advice was drawn.
    async function refreshRewards(){
      const button=$("#rewardRefresh"),status=$("#rewardStatus"),output=$("#rewardResults");
      if(button.disabled)return false;
      button.disabled=true;
      // Keep the last advice on screen while re-reading (it refreshes every few seconds).
      if(!output.childElementCount)status.textContent="正在讀取…";
      try {
        const response=await fetch("/rewards",{headers:{"X-STS2-Capture":"1"}});
        const reward=await response.json();
        if(!response.ok&&await renderEvent(status,output)){setPhase("choice");return true;}
        if(!response.ok)throw new Error(reward.error||"獎勵讀取失敗。");
        setPhase("choice");
        if(reward.restSite){
          setRewardIcon("rest");
          const rest=reward.recommendation==="rest";
          status.textContent=`營火 · ${reward.hp}/${reward.maxHp} HP。生命低於 60% 時休息，否則鍛造。`;
          const restRow=`<article class="row-card${rest?" pick":""}">${icon("rest")}${rest?'<span class="pick-label">選這個</span>':""}<strong>休息</strong><p class="row-caption">回復 ${reward.heal} HP</p></article>`;
          output.innerHTML=(rest?restRow:"")+(reward.upgrades.length?reward.upgrades.map((u,i)=>`<article class="row-card${i===0&&!rest?" pick":""}">${icon("card")}
            ${i===0&&!rest?'<span class="pick-label">鍛造這張</span>':""}<strong>${esc(u.name)}</strong>
            <p class="row-caption">升級收益 ${u.gain}</p><p>${u.reasons.map(esc).join("、")}</p></article>`).join("")
            :`<p class="row-caption">牌組裡沒有能判斷升級收益的牌。</p>`)+(rest?"":restRow);
          return true;
        }
        setRewardIcon(reward.shop?"shop":"gift");
        if(!gameNames){try{const r=await fetch("/names",{headers:{"X-STS2-Capture":"1"}});if(r.ok)gameNames=await r.json();}catch{}}
        const ranked=globalThis.planRewards(reward);
        const labels={Cruelty:"殘酷",Inferno:"獄火",Unrelenting:"無情猛攻",MoltenFist:"熔融之拳",Glimmer:"微光",Anchor:"船錨",BagOfPreparation:"準備背包",BloodVial:"小血瓶",
          BattleTrance:"戰鬥專注",TrueGrit:"堅毅",Breakthrough:"突破",TheGambit:"孤注一擲",Salvo:"箭雨"};
        const pools={IroncladCardPool:"鐵甲戰士",SilentCardPool:"靜默獵手",RegentCardPool:"攝政王",
          NecrobinderCardPool:"亡靈契約師",DefectCardPool:"故障機器人",FoolCardPool:"愚者",ColorlessCardPool:"無色",
          EventCardPool:"事件",CurseCardPool:"詛咒",StatusCardPool:"狀態"};
        status.textContent=reward.shop
          ? `持有 ${reward.gold} 金幣。依每 100 金幣的收益排序；成交價以遊戲為準。`
          : "依可計分的效果排序；沒有數值的效果請看牌面。";
        const kinds={card:"card",relic:"gift",potion:"potion",remove:"shop",skip:"end"};
        const best=ranked.find(c=>c.evaluated&&c.score>0&&c.affordable!==false&&String(c.kind).toLowerCase()!=="skip");
        output.innerHTML=ranked.map(choice=>{
          const id=choice.name.replace(/([a-z0-9])([A-Z])/g,"$1_$2").toUpperCase();
          const title=choice.title||gameNames?.cards?.[id]||gameNames?.relics?.[id]||gameNames?.potions?.[id]||(Object.hasOwn(labels,choice.name)?labels[choice.name]:choice.name);
          const pick=choice===best;
          return `<article class="row-card${pick?" pick":""}">${icon(kinds[String(choice.kind).toLowerCase()]??"gift")}
            ${pick?`<span class="pick-label">${reward.shop?"買這個":"選這個"}</span>`:""}<strong>${esc(title)}</strong>
            <p class="row-caption">${Object.hasOwn(pools,choice.pool)?`${pools[choice.pool]} · `:""}${choice.price==null?"":`${choice.price} 金幣 · `}${choice.affordable===false?"金幣不足":choice.evaluated?`評分 ${choice.score.toFixed(1)}`:"未評估"}</p>
            ${choice.description?`<p>${esc(choice.description)}</p>`:""}
            ${choice.reasons.filter(reason=>!reason.endsWith("依 0 分排序。")).map(reason=>`<p>${esc(reason)}</p>`).join("")}</article>`;
        }).join("");
        return true;
      } catch(error) {
        output.replaceChildren();
        setRewardIcon("gift");
        status.textContent="打開獎勵、商店、營火或事件時，這裡會排出最佳選項。";
        return false;
      } finally {
        button.disabled=false;
      }
    }
    $("#rewardRefresh").addEventListener("click",refreshRewards);
    const overlay=new URLSearchParams(location.search).has("overlay");
    if(livePage){
      refreshLive();
      setInterval(refreshLive,overlay?2000:5000);
      if(overlay)document.body.classList.add("overlay");
      // Outside combat, follow the game: a choice screen first, otherwise the map.
      let advising=false;
      setInterval(async()=>{
        if(solvedState||advising||!autoEnabled||document.hidden)return;
        advising=true;
        try { if(!(await refreshRewards()))await refreshMap(); } finally { advising=false; }
      },4000);
      document.addEventListener("visibilitychange",refreshLive);
    }
  </script>
